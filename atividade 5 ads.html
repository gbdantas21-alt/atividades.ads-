<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de Frete — Uninassau Parangaba</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#161a26;--mut:#667085;--bd:#e2e6ef;--pri:#4f46e5;--pri-tx:#fff;--ok:#16a34a;--err:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0e111b;--card:#171b2b;--tx:#eef0f7;--mut:#9aa3b8;--bd:#283049;--pri:#818cf8;--pri-tx:#0e111b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;text-align:center;padding:44px 16px 64px}
header h1{margin:0 0 8px;font-size:clamp(24px,6vw,36px)}
header p{margin:0;opacity:.92}
main{max-width:520px;margin:-36px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:10px}
input{flex:1;font:inherit;font-size:18px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;min-width:0}
input:focus{outline:2px solid var(--pri)}
button{font:inherit;font-weight:700;background:var(--pri);color:var(--pri-tx);border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#st{margin-top:12px;font-size:14px;color:var(--mut);min-height:20px}
#st.err{color:var(--err)}
.addr{font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.box small{display:block;color:var(--mut);font-size:12px}
.box b{font-size:20px}
.total{text-align:center;background:var(--pri);color:var(--pri-tx);border-radius:14px;padding:16px}
.total small{display:block;opacity:.85}
.total b{font-size:34px}
.hide{display:none}
.note{font-size:12px;color:var(--mut);text-align:center}
table{width:100%;font-size:13px;color:var(--mut);margin-top:8px}
td:last-child{text-align:right}
</style>
</head>
<body>
<header>
  <h1>🏍️ Calculadora de Frete</h1>
  <p>Saindo da Uninassau Parangaba, Fortaleza</p>
</header>

<main>
  <div class="card">
    <label for="cep">CEP de entrega</label>
    <div class="row">
      <input id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code">
      <button id="btn">Calcular</button>
    </div>
    <div id="st"></div>
  </div>

  <div class="card hide" id="res">
    <div class="addr" id="addr"></div>
    <div class="grid">
      <div class="box"><small>Distância</small><b id="km">—</b></div>
      <div class="box"><small>Tempo estimado</small><b id="min">—</b></div>
    </div>
    <table>
      <tr><td>Estimativa Uber Moto</td><td id="uber">—</td></tr>
      <tr><td>Taxa de serviço</td><td id="taxa">—</td></tr>
    </table>
    <div class="total" style="margin-top:12px"><small>Frete total</small><b id="frete">—</b></div>
  </div>

  <p class="note">Valor estimado. O Uber não disponibiliza API pública de preços; o cálculo usa uma fórmula de base + km + minutos.</p>
</main>

<script>
/* ===== CONFIGURAÇÕES — ajuste aqui ===== */
// Coordenadas aproximadas da Uninassau Parangaba (confirme no Google Maps: clique direito > copiar coordenadas)
const ORIGEM = { lat: -3.7760, lon: -38.5590, nome: "Uninassau Parangaba" };
const UBER = { base: 2.00, porKm: 0.95, porMin: 0.20, minimo: 6.00 };
const TAXA_SERVICO = 3.00; // acrescentada ao valor estimado do Uber
/* ====================================== */

const $ = id => document.getElementById(id);
const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const st = (msg, err) => { $("st").textContent = msg; $("st").className = err ? "err" : ""; };

$("cep").addEventListener("input", e => {
  let v = e.target.value.replace(/\D/g, "").slice(0, 8);
  if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
  e.target.value = v;
});
$("cep").addEventListener("keydown", e => { if (e.key === "Enter") calcular(); });
$("btn").addEventListener("click", calcular);

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("Falha na requisição (" + r.status + ")");
  return r.json();
}

async function geocodificar(d) {
  const base = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q=";
  const tentativas = [
    [d.logradouro, d.bairro, d.localidade, d.uf],
    [d.bairro, d.localidade, d.uf],
    [d.localidade, d.uf]
  ];
  for (const t of tentativas) {
    const q = t.filter(Boolean).join(", ");
    if (!q) continue;
    const r = await getJSON(base + encodeURIComponent(q));
    if (r.length) return { lat: +r[0].lat, lon: +r[0].lon };
  }
  throw new Error("Não foi possível localizar esse endereço no mapa.");
}

async function calcular() {
  const cep = $("cep").value.replace(/\D/g, "");
  $("res").classList.add("hide");
  if (cep.length !== 8) return st("Digite um CEP válido com 8 números.", true);

  $("btn").disabled = true;
  try {
    st("Buscando endereço...");
    const d = await getJSON("https://viacep.com.br/ws/" + cep + "/json/");
    if (d.erro) throw new Error("CEP não encontrado.");

    st("Localizando no mapa...");
    const dest = await geocodificar(d);

    st("Calculando rota...");
    const url = "https://router.project-osrm.org/route/v1/driving/" +
      ORIGEM.lon + "," + ORIGEM.lat + ";" + dest.lon + "," + dest.lat + "?overview=false";
    const rota = await getJSON(url);
    if (!rota.routes || !rota.routes.length) throw new Error("Não foi possível traçar a rota.");

    const km = rota.routes[0].distance / 1000;
    const min = Math.max(1, Math.round(rota.routes[0].duration / 60));
    const uber = Math.max(UBER.minimo, UBER.base + km * UBER.porKm + min * UBER.porMin);
    const total = uber + TAXA_SERVICO;

    $("addr").innerHTML = "<b>" + [d.logradouro, d.bairro].filter(Boolean).join(" — ") + "</b><br>" +
      d.localidade + " / " + d.uf + " • CEP " + d.cep;
    $("km").textContent = km.toFixed(1).replace(".", ",") + " km";
    $("min").textContent = min + " min";
    $("uber").textContent = brl(uber);
    $("taxa").textContent = brl(TAXA_SERVICO);
    $("frete").textContent = brl(total);
    $("res").classList.remove("hide");
    st("");
  } catch (e) {
    st(e.message || "Erro ao calcular. Tente novamente.", true);
  } finally {
    $("btn").disabled = false;
  }
}
</script>
</body>
</html>
